server.port=8083
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Auth-Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# User-Service
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/users/**

# Offre-Service
spring.cloud.gateway.server.webflux.routes[2].id=offre-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://OFFRE-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/offres/**

# Candidatures
spring.cloud.gateway.server.webflux.routes[3].id=candidature-service-route
spring.cloud.gateway.server.webflux.routes[3].uri=lb://OFFRE-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/candidatures/**

# Notifications (user-service)
spring.cloud.gateway.server.webflux.routes[4].id=notification-service-route
spring.cloud.gateway.server.webflux.routes[4].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/notifications,/notifications/**

# Test-Service (FastAPI :8005 — hors Eureka)
spring.cloud.gateway.server.webflux.routes[5].id=test-service
spring.cloud.gateway.server.webflux.routes[5].uri=http://127.0.0.1:8005
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/tests/**

jwt.secret=1234567890123456789012345678901234567890123456789012345678901234