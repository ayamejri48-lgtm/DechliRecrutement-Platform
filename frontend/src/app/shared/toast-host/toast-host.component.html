<div class="toast-stack" aria-live="polite" aria-relevant="additions">
  @for (t of toast.items(); track t.id) {
    <div class="toast" [attr.data-kind]="t.kind" role="status">
      <span class="toast-icon" aria-hidden="true">
        @switch (t.kind) {
          @case ('success') {
            <svg viewBox="0 0 24 24"><path d="M9.2 16.2 5.8 12.8l1.4-1.4 2 2 6.2-6.2 1.4 1.4z"/></svg>
          }
          @case ('error') {
            <svg viewBox="0 0 24 24"><path d="M12 7.5a1 1 0 0 1 1 1V13a1 1 0 1 1-2 0V8.5a1 1 0 0 1 1-1Zm0 9.25a1.15 1.15 0 1 1 0-2.3 1.15 1.15 0 0 1 0 2.3Z"/><path d="M12 3.5 21 19.5H3L12 3.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          }
          @case ('warn') {
            <svg viewBox="0 0 24 24"><path d="M12 8.2v5.1M12 16.2h.01M11 4.8 2.8 19.2h18.4L11 4.8Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          }
          @default {
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 10.2v5M12 7.8h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          }
        }
      </span>
      <p class="toast-msg">{{ t.message }}</p>
      <button
        type="button"
        class="toast-close"
        aria-label="Fermer la notification"
        (click)="toast.dismiss(t.id)"
      >
        ×
      </button>
    </div>
  }
</div>
