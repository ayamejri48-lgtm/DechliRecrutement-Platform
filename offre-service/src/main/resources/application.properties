spring.application.name=offre-service
server.port=8084

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/offre_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT Security
jwt.secret=1234567890123456789012345678901234567890123456789012345678901234

# JWT interservices (≠ jwt.secret) — même secret que user-service
internal.jwt.secret=InternalSvcJwtSecretKey_DechliRecrutement_HS256_ChangeMe!
internal.jwt.issuer=offre-service
internal.jwt.audience=user-service
internal.jwt.ttl-seconds=60

# Kafka Producer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# AI-Service (FastAPI interne — ne pas exposer via Gateway)
ai.service.base-url=http://localhost:8000
ai.service.api-key=dechli-ai-internal-dev-key
ai.service.connect-timeout-ms=5000
ai.service.read-timeout-ms=60000

# Feign user-service — éviter les hangs dossier (profil / CV)
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=8000
spring.cloud.openfeign.client.config.user-service.connectTimeout=3000
spring.cloud.openfeign.client.config.user-service.readTimeout=8000